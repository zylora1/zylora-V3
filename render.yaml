databases:
  - name: zylora-db
    databaseName: zylora
    user: zylora
    plan: starter

services:
  - type: web
    name: zylora-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zylora-db
          property: connectionString
      - key: APP_URL
        value: "https://zylora-app.onrender.com"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: STUDIO_ENGINE
        value: "onlook"
