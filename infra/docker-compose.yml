services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zylora
      POSTGRES_USER: zylora
      POSTGRES_PASSWORD: zylora
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zylora"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: zylora
      MINIO_ROOT_PASSWORD: zylora-secret
    ports: ["9000:9000", "9001:9001"]
