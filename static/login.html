<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Zylora</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Sign in to your Zylora workspace.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body style="background-color:#FBFBF9">
  <main class="auth-v2">
    <!-- Brand link (Tinkered top-left) -->
    <a href="/" class="av-brand" aria-label="Zylora home">
      <svg class="av-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L12 6M12 18L12 22M2 12H6M18 12H22M4.92893 4.92893L7.75736 7.75736M16.2426 16.2426L19.0711 19.0711M4.92893 19.0711L7.75736 16.2426M16.2426 7.75736L19.0711 4.92893"></path>
      </svg>
      <span class="av-brand-name">Zylora</span>
    </a>

    <!-- Center Card (Tinkered auth-v2 exact layout) -->
    <div class="av-main">
      <div class="av-card">
        <div class="av-hero">
          <h1 class="av-hero-title">Welcome back</h1>
          <p class="av-hero-sub">Describe it. Build it. Ship it.</p>
        </div>

        <!-- Google SSO -->
        <a class="av-btn-google" href="/api/auth/google/start" data-testid="google-login">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M47.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h13.2c-.6 3-2.3 5.5-4.9 7.2v6h7.9c4.6-4.2 7.3-10.5 7.3-17.2z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.9-6c-2.1 1.4-4.8 2.2-8 2.2-6.1 0-11.3-4.1-13.2-9.7H2.7v6.2C6.7 42.7 14.8 48 24 48z"/>
            <path fill="#FBBC05" d="M10.8 28.7c-.5-1.4-.7-2.9-.7-4.7s.3-3.3.7-4.7v-6.2H2.7C1 16.3 0 20 0 24s1 7.7 2.7 10.9l8.1-6.2z"/>
            <path fill="#EA4335" d="M24 9.5c3.4 0 6.5 1.2 8.9 3.5l6.6-6.6C35.9 2.5 30.4 0 24 0 14.8 0 6.7 5.3 2.7 13.1l8.1 6.2C12.7 13.6 17.9 9.5 24 9.5z"/>
          </svg>
          <span>Continue with Google</span>
        </a>

        <div class="av-or"><span>or</span></div>

        <!-- Login Form -->
        <form class="av-form" id="loginForm">
          <div class="av-field">
            <label class="av-label" for="email">Email</label>
            <input class="av-input" id="email" name="email" type="email" required autocomplete="email" placeholder="name@company.com">
          </div>

          <div class="av-field">
            <div class="av-label-row">
              <label class="av-label" for="password">Password</label>
              <a class="av-forgot" href="/forgot-password">Forgot password?</a>
            </div>
            <input class="av-input" id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
            <div class="av-field-error" id="passwordError">Password too short</div>
          </div>

          <button class="av-btn-submit submit" type="submit" data-testid="login-submit">Sign in</button>
          <div class="av-msg msg" id="msg" role="alert"></div>

          <div class="av-foot">
            Don't have an account? <a class="av-foot-link" href="/signup">Sign up</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Bottom Terms Strip -->
    <div class="av-terms-strip">
      By continuing, you agree to our <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>
    </div>
  </main>

  <script src="/static/zylora-ui.js"></script>
  <script src="/static/auth.js"></script>
</body>
</html>
