<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in to Zylora</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/zylora-ui.css"><link rel="stylesheet" href="/static/auth.css"></head><body><section class="art"><a class="home" href="/">Back home</a><div class="brand z-wordmark">Zylora</div><h1>Your sites, leads and work — together.</h1><p>Pick up where you left off in the Zylora operations dashboard.</p><div class="orb"></div></section><section class="formpane"><form class="box" id="loginForm"><h2>Welcome back</h2><p>Sign in to your workspace.</p><a class="google" href="/api/auth/google/start" data-testid="google-login"><span>G</span>Continue with Google</a><div class="divider"><span>or use email</span></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><div class="label-row"><label for="password">Password</label><a href="/forgot-password">Forgot password?</a></div><input id="password" name="password" type="password" required autocomplete="current-password"></div><button class="submit" type="submit" data-testid="login-submit">Log in</button><div class="msg" id="msg" role="alert"></div><div class="alt">New to Zylora? <a href="/signup">Create an account</a></div></form></section><script src="/static/zylora-ui.js"></script><script src="/static/auth.js"></script></body></html>
