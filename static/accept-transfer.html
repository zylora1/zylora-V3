<!doctype html><html lang="en"><head>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Zylora website ownership</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/zylora-ui.css"><link rel="stylesheet" href="/static/auth.css"></head><body><section class="art"><div class="brand z-wordmark">Zylora</div><h1>Website ownership transfer.</h1><p>Sign in with the invited email, then accept the transfer.</p><div class="orb"></div></section><section class="formpane"><div class="box"><h2>Accept ownership</h2><p id="msg">Ready to transfer the website into your workspace.</p><button class="submit" id="accept" data-testid="accept-transfer">Accept website</button><div class="alt"><a href="/login">Sign in first</a></div></div></section><script src="/static/zylora-ui.js"></script><script>accept.onclick=async()=>{const token=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('debugTransferToken')||'';const me=await fetch('/api/auth/me');if(!me.ok){location.href='/login';return}const u=await me.json();const r=await fetch('/api/ownership/accept',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':sessionStorage.getItem('csrf')||u.csrf_token},body:JSON.stringify({token})});const j=await r.json();msg.textContent=r.ok?'Ownership transferred. Open the dashboard to manage the website.':(j.detail||'Transfer failed.');}</script></body></html>
