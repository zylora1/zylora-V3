<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new Zylora password</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/zylora-ui.css"><link rel="stylesheet" href="/static/auth.css"></head><body><section class="art"><div class="brand z-wordmark">Zylora</div><h1>Choose a new password.</h1><div class="orb"></div></section><section class="formpane"><form class="box"><h2>New password</h2><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="submit" data-testid="reset-submit">Update password</button><div class="msg" id="msg"></div></form></section><script src="/static/zylora-ui.js"></script><script>const q=new URLSearchParams(location.search),f=document.querySelector('form'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();const token=q.get('token')||sessionStorage.getItem('debugResetToken')||'';const r=await fetch('/api/auth/password/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});const j=await r.json();if(r.ok){m.style.color='#275d2d';m.innerHTML='Password updated. <a href="/login">Log in</a>'}else m.textContent=j.detail||'Could not reset password'}</script></body></html>
