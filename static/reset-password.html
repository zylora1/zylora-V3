<!doctype html><html lang="en"><head>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new Zylora password</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/zylora-ui.css"><link rel="stylesheet" href="/static/auth.css"></head><body><section class="art"><div class="brand z-wordmark">Zylora</div><h1>Choose a new password.</h1><div class="orb"></div></section><section class="formpane"><form class="box"><h2>New password</h2><div class="field"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"><div class="field-msg" id="passwordError" style="color:#9f2f27;font-size:12px;margin-top:4px;display:none;">Password too short</div></div><button class="submit" data-testid="reset-submit">Update password</button><div class="msg" id="msg"></div></form></section><script src="/static/zylora-ui.js"></script><script>const q=new URLSearchParams(location.search),f=document.querySelector('form'),m=document.querySelector('#msg'),pwd=document.querySelector('#password'),pwdErr=document.querySelector('#passwordError');if(pwd&&pwdErr){pwd.addEventListener('input',()=>{if(pwd.value.length>0&&pwd.value.length<8){pwdErr.textContent='Password too short';pwdErr.style.display='block'}else{pwdErr.style.display='none'}})}f.onsubmit=async e=>{e.preventDefault();if(pwd&&pwdErr&&pwd.value.length<8){pwdErr.textContent='Password too short';pwdErr.style.display='block';pwd.focus();return}else if(pwdErr){pwdErr.style.display='none'}const token=q.get('token')||sessionStorage.getItem('debugResetToken')||'';const r=await fetch('/api/auth/password/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pwd.value})});const j=await r.json();if(r.ok){m.style.color='#275d2d';m.innerHTML='Password updated. <a href="/login">Log in</a>'}else m.textContent=j.detail||'Could not reset password'}</script></body></html>
