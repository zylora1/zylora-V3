<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zylora Studio</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; background: #000; color: #fff; }
        .zylora-studio-app { display: flex; flex-direction: column; height: 100vh; }
        .studio-topbar { height: 50px; background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; border-bottom: 1px solid #333; }
        .studio-main { display: flex; flex: 1; overflow: hidden; }
        .studio-sidebar-left { width: 250px; background: #1a1a1a; border-right: 1px solid #333; overflow-y: auto; }
        .studio-sidebar-right { width: 300px; background: #1a1a1a; border-left: 1px solid #333; overflow-y: auto; }
        .studio-canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; overflow: auto; padding: 2rem; }
        .studio-canvas { width: 100%; height: 100%; background: #fff; color: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden; position: relative; }
        .panel-title { padding: 1rem; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #333; color: #888; }
        .studio-controls button { background: #333; color: #fff; border: 1px solid #444; padding: 0.5rem 1rem; margin-left: 0.5rem; border-radius: 4px; cursor: pointer; }
        .studio-controls button:hover { background: #444; }
    </style>
</head>
<body>
    <div id="studio-root"></div>
    <!-- Expose site_id and other context safely to React -->
    <script>
        window.ZYLORA_STUDIO_CONTEXT = {
            siteId: window.location.pathname.split('/')[2]
        };
    </script>
    <script src="/static/studio.js"></script>
</body>
</html>
