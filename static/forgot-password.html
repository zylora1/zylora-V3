<!doctype html><html lang="en"><head>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your Zylora password</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/zylora-ui.css"><link rel="stylesheet" href="/static/auth.css"></head><body><section class="art"><a class="home" href="/login">Back to login</a><div class="brand z-wordmark">Zylora</div><h1>Reset access securely.</h1><p>We will email a short-lived password reset link if the account exists.</p><div class="orb"></div></section><section class="formpane"><form class="box" id="forgotForm"><h2>Forgot password?</h2><p>Enter the email attached to your workspace.</p><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><button class="submit" type="submit" data-testid="forgot-submit">Send reset link</button><div class="msg" id="msg" role="status"></div></form></section><script src="/static/zylora-ui.js"></script><script>const f=document.querySelector('form'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/password/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.email.value})});const j=await r.json();m.style.color=r.ok?'#275d2d':'#b42318';m.textContent=j.message||j.detail||'Request complete';if(j.debug_token){sessionStorage.setItem('debugResetToken',j.debug_token);m.textContent+=' Development token stored for testing.'}}</script></body></html>
