<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freelancer — Zylora</title><meta name="description" content="Approved Zylora freelancer profile."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/freelancers.css"></head><body><header class="fm-nav"><a class="fm-brand" href="/">Zylora</a><nav><a href="/freelancers">← Freelancers</a><a href="/templates">Templates</a><a href="/login">Log in</a><a class="fm-cta" href="/signup">Get started</a></nav></header><main class="fm-main" id="profileRoot"><div class="fm-empty" style="margin-top:70px">Loading freelancer profile…</div></main><footer class="fm-footer"><strong>Zylora</strong><span>Payments, contracts and project communication happen directly with the freelancer.</span></footer><div class="fm-modal" id="enquiryModal" hidden><div class="fm-modal-card"><button class="fm-btn" id="closeEnquiry" type="button" style="float:right">Close</button><p class="fm-eyebrow">Zylora enquiry fallback</p><h2>Send a concise enquiry</h2><p>The freelancer will receive your contact details. No Zylora account is required.</p><form class="fm-form" id="enquiryForm"><label>Name<input id="enquiryName" required minlength="2" maxlength="100"></label><label>Email<input id="enquiryEmail" type="email" required maxlength="254"></label><label>Business/company (optional)<input id="enquiryCompany" maxlength="140"></label><label>Website type<input id="enquiryType" required maxlength="120" placeholder="Portfolio, clinic, restaurant…"></label><label>Project description<textarea id="enquiryDescription" required minlength="20" maxlength="3000"></textarea></label><label>Budget (optional)<input id="enquiryBudget" maxlength="120"></label><label>Preferred contact method (optional)<input id="enquiryContact" maxlength="120" placeholder="Email, Fiverr, phone…"></label><label class="honeypot" aria-hidden="true">Website<input id="enquiryWebsite" tabindex="-1" autocomplete="off"></label><div id="turnstileSlot" class="turnstile-slot" aria-label="Bot protection"></div><button class="fm-btn primary" type="submit">Send enquiry</button><p class="fm-status" id="enquiryStatus" role="status"></p></form></div></div><script src="/static/freelancer-profile.js"></script></body></html>
