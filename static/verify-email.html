<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your Zylora email</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/zylora-ui.css"><link rel="stylesheet" href="/static/auth.css"></head><body><section class="art"><div class="brand z-wordmark">Zylora</div><h1>One click before publishing.</h1><p>Email verification protects ownership, publishing and account recovery.</p><div class="orb"></div></section><section class="formpane"><div class="box"><h2>Verify email</h2><p id="msg">Checking your verification link…</p><a class="submit" style="display:grid;place-items:center;text-decoration:none" href="/dashboard">Return to dashboard</a></div></section><script src="/static/zylora-ui.js"></script><script>(async()=>{const token=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('debugVerifyToken')||'';const m=document.querySelector('#msg');if(!token){m.textContent='No verification token was provided.';return}const r=await fetch('/api/auth/email/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const j=await r.json();m.textContent=r.ok?'Email verified. You can now publish websites.':(j.detail||'Verification failed.');if(r.ok)sessionStorage.removeItem('debugVerifyToken')})()</script></body></html>
