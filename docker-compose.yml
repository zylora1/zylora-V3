services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zylora}
      POSTGRES_USER: ${POSTGRES_USER:-zylora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zylora-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zylora} -d ${POSTGRES_DB:-zylora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zylora_pg:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Safe local default. Production must explicitly set APP_ENV=production
      # together with an HTTPS public APP_URL and real provider credentials.
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zylora}:${POSTGRES_PASSWORD:-zylora-dev-only}@db:5432/${POSTGRES_DB:-zylora}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-admin@example.com}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      AI_GATEWAY_PROVIDER: ${AI_GATEWAY_PROVIDER:-vercel}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-https://ai-gateway.vercel.sh/v1}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-openai/gpt-5-mini}
      AI_SALES_ASSISTANT_MODEL: ${AI_SALES_ASSISTANT_MODEL:-openai/gpt-4o-mini}
      AI_EDITOR_MODEL: ${AI_EDITOR_MODEL:-openai/gpt-5-mini}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_BASE_URL: ${TELNYX_BASE_URL:-https://api.telnyx.com/v2}
      TELNYX_EMAIL_FROM: ${TELNYX_EMAIL_FROM:-}
      TELNYX_EMAIL_DOMAIN_ID: ${TELNYX_EMAIL_DOMAIN_ID:-}
      TELNYX_WHATSAPP_FROM: ${TELNYX_WHATSAPP_FROM:-}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID:-}
      TELNYX_SMS_FROM: ${TELNYX_SMS_FROM:-}
      AI_COST_ALERT_USD: ${AI_COST_ALERT_USD:-0}
      TELNYX_MESSAGE_ALERT_COUNT: ${TELNYX_MESSAGE_ALERT_COUNT:-0}
      COMMUNICATION_FAILURE_ALERT_PCT: ${COMMUNICATION_FAILURE_ALERT_PCT:-0}
      TELNYX_WEBHOOK_PUBLIC_KEY: ${TELNYX_WEBHOOK_PUBLIC_KEY:-}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      SALES_ASSISTANT_MODEL: ${SALES_ASSISTANT_MODEL:-gpt-4o-mini}
      EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-25}
      EMAIL_MAX_SENDS_PER_MINUTE: ${EMAIL_MAX_SENDS_PER_MINUTE:-60}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-4}
      EMAIL_RETRY_BASE_DELAY: ${EMAIL_RETRY_BASE_DELAY:-60}
      EMAIL_CAMPAIGN_UPLOAD_MAX_MB: ${EMAIL_CAMPAIGN_UPLOAD_MAX_MB:-8}
      EMAIL_ATTACHMENT_MAX_MB: ${EMAIL_ATTACHMENT_MAX_MB:-10}
      EMAIL_ATTACHMENT_TOTAL_MAX_MB: ${EMAIL_ATTACHMENT_TOTAL_MAX_MB:-20}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_SAAS_TARGET: ${CLOUDFLARE_SAAS_TARGET:-sites.zylora.example}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN:-zylora.example}
      INDEXNOW_ENDPOINT: ${INDEXNOW_ENDPOINT:-https://api.indexnow.org/indexnow}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_STORAGE_DIR: /app/data/media
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-12}
      MEDIA_MAX_PIXELS: ${MEDIA_MAX_PIXELS:-40000000}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      MEDIA_S3_PREFIX: ${MEDIA_S3_PREFIX:-zylora-media}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      STUDIO_ENGINE: ${STUDIO_ENGINE:-legacy}
      PENPOT_BASE_URL: ${PENPOT_BASE_URL:-}
      PENPOT_INTERNAL_URL: ${PENPOT_INTERNAL_URL:-}
      PENPOT_UPSTREAM_REPO: ${PENPOT_UPSTREAM_REPO:-https://github.com/penpot/penpot}
      PENPOT_UPSTREAM_VERSION: ${PENPOT_UPSTREAM_VERSION:-}
      PENPOT_UPSTREAM_COMMIT: ${PENPOT_UPSTREAM_COMMIT:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_SIGNING_KEY: ${OIDC_SIGNING_KEY:-}
      OIDC_SIGNING_KEY_ID: ${OIDC_SIGNING_KEY_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    volumes:
      - zylora_media:/app/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports:
      - "8000:8000"

volumes:
  zylora_pg:
  zylora_media:
